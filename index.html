<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <title>Ejercicio 3</title>
</head>
<body>
    <div class="container mt-5 text-center">
        <div class="col-md-6 mx-auto">
            <h2>Conversión de Unidades</h2>
            <form id="convercionesForm">
                <!-- Kilómetros a metros -->
                <div class="row mb-3">
                    <div class="col-12">
                        <label for="km" class="form-label">Kilómetros a Metros</label>
                        <input type="number" class="form-control" id="km" placeholder="Ingrese los kilómetros">
                    </div>
                    <div class="col-12 mt-2">
                        <input type="number" class="form-control" id="metros" placeholder="Resultado en metros" readonly>
                    </div>
                </div>
                <button type="button" class="btn btn-primary mb-4" id="btnKm" onclick="convertirKmToMeter()">Calcular</button>

                <!-- Metros a centímetros -->
                <div class="row mb-3">
                    <div class="col-12">
                        <label for="metrosDos" class="form-label">Metros a Centímetros</label>
                        <input type="number" class="form-control" id="metrosDos" placeholder="Ingrese los metros">
                    </div>
                    <div class="col-12 mt-2">
                        <input type="number" class="form-control" id="cm" placeholder="Resultado en centímetros" readonly>
                    </div>
                </div>
                <button type="button" class="btn btn-primary mb-4" id="btnMetros" onclick="convertirMetrosToCm()">Calcular</button>

                <!-- Pulgadas a pies -->
                <div class="row mb-3">
                    <div class="col-12 mt-2">
                        <label for="pulgadas" class="form-label">Pulgadas a Pies</label>
                        <input type="number" class="form-control" id="pulgadas" placeholder="Ingrese las pulgadas">
                    </div>
                    <div class="col-12 mt-2">
                        <input type="number" class="form-control" id="ft" placeholder="Resultado en pies" readonly>
                    </div>
                </div>
                <button type="button" class="btn btn-primary" id="btnFt" onclick="convertirPulgadasToPies()">Calcular</button>

                 <!-- yardas a pulgadas -->
                 <div class="row mb-3">
                    <div class="col-12 mt-2">
                        <label for="yarda" class="form-label">Yarda a pulgadas</label>
                        <input type="number" class="form-control" id="yarda" placeholder="Ingrese las pulgadas">
                    </div>
                    <div class="col-12 mt-2">
                        <input type="number" class="form-control" id="plg" placeholder="Resultado en pulgadas" readonly>
                    </div>
                </div>
                <button type="button" class="btn btn-primary" id="btnFt" onclick="convertirYardaToPlg()">Calcular</button>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
    <script src="assets/indext.js"></script>
</body>
</html>
